name: Documentation
description: Something in the documentation is wrong, unclear or missing
labels: ['type: docs', 'status: needs triage']
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: A link to the page or section on meocord.dev, or the file and heading — README, migration guide or a JSDoc comment.
      placeholder: https://meocord.dev/docs/latest/testing
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: What the documentation says, and what actually happens or what you needed to know.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How it should read, if you have a suggestion.
