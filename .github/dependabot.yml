version: 2
updates:
  # Dependabot writes no changeset. A bump that changes what a consumer installs needs one before it merges, and
  # the Lint check fails without it: a changed range in package.json's dependencies, peerDependencies or
  # optionalDependencies, or a new locked version of a package dist/cjs bundles (chalk, inversify and their
  # dependencies). Run `bun run changeset` on the branch, or `bun run changeset --empty` for a bump that needs no
  # release note. Any other bump changes only bun.lock, which isn't published, so it needs none, and neither do dev
  # dependencies or actions. Majors are split out of the groups because they are the ones that need reading rather
  # than merging.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: dependencies']
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # discord.js is a peer dependency: the range is a compatibility contract with the
      # consumer, not something to bump on a schedule. Widen it deliberately instead.
      - dependency-name: discord.js
      # vitest 5.1.1's fork pool calls child.channel.unref(), which Bun's IPC channel lacks (oven-sh/bun#33593), so
      # test:bun cannot start a worker. vitest-dev/vitest#12039 makes the call optional: until a vitest release carries
      # it, or Bun ships channel.unref, package.json holds vitest at 5.1.0. Later releases are still proposed.
      - dependency-name: vitest
        versions: ['5.1.1']
      - dependency-name: '@vitest/coverage-istanbul'
        versions: ['5.1.1']

  # The test runners scripts/verify-runners.ts installs, one project each. group-by: dependency-name opens one pull
  # request per dependency, moving it in all four projects at once. The nightly workflow tests the runners' newest
  # releases first; these locks are what pull requests and releases test against.
  - package-ecosystem: bun
    directories:
      - /scripts/runner-consumers/bun
      - /scripts/runner-consumers/jest
      - /scripts/runner-consumers/node-test
      - /scripts/runner-consumers/vitest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
    groups:
      runners:
        patterns: ['*']
        group-by: dependency-name
    ignore:
      # The vitest project pins vitest at 5.1.0, as package.json does: 5.1.1's fork pool cannot start under Bun.
      - dependency-name: vitest
        versions: ['5.1.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
