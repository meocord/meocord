version: 2
updates:
  # A runtime dependency ships inside the published package, so a bump to one is a `patch`
  # a consumer should see in the changelog — add a changeset to the pull request before
  # merging it. Dev dependencies and actions reach no consumer and need none. Majors are
  # split out of the groups because they are the ones that need reading rather than merging.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: dependencies']
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # discord.js is a peer dependency: the range is a compatibility contract with the
      # consumer, not something to bump on a schedule. Widen it deliberately instead.
      - dependency-name: discord.js
      # Pinned exactly on purpose — @swc/core is the transform behind emitDecoratorMetadata,
      # and a floating patch there changes what every generated app compiles to.
      - dependency-name: '@swc/core'

  # The test runners scripts/verify-runners.ts installs, one project each, every dependency moved across the projects in
  # one pull request. The
  # nightly workflow tests their newest releases first; these locks are what pull requests and releases test against.
  - package-ecosystem: bun
    directories:
      - /scripts/runner-consumers/bun
      - /scripts/runner-consumers/jest
      - /scripts/runner-consumers/node-test
      - /scripts/runner-consumers/vitest
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
    groups:
      runners:
        patterns: ['*']
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['type: dependencies']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
