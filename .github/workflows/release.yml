name: Release

on:
  push:
    branches:
      - main
      - beta
      # The 4.0 maintenance line: patch releases of 4.0, published from this branch.
      - release/4.0
  pull_request:
    branches:
      - main
      - beta
      - release/4.0
  # Publishing is gated by merging the release pull request, so this is not how a
  # release is started. It is here to re-run the job after a publish fails partway.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run in flight irrelevant. Release branches are
# keyed individually so a release is never cancelled by the push that follows it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before `lint`, which runs prettier in --write mode: it would reformat the
      # working tree and exit 0, so nothing unformatted could ever fail CI.
      - name: Check formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      # Generated from the installed packages, so a dependency added without regenerating it
      # fails here rather than shipping a notice that leaves it out.
      - name: Check third-party notices
        run: bun run notices:check

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the newest LTS. Anything between the two
        # is covered by whichever of them breaks first.
        node: ['22.13', 'lts/*']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # Branch protection requires a check named exactly "Test". A matrix names each leg
  # after its parameters, so this gate carries that name and reports the matrix result.
  test-result:
    name: Test
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Report the matrix result
        if: needs.test.result != 'success'
        run: |
          echo "One or more Node versions failed: ${{ needs.test.result }}"
          exit 1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report coverage
        run: bun run test:coverage

  # Windows resolves a bin differently: npm never runs the file through its shebang,
  # it parses the line and writes a `.cmd` that runs the program named there. Nothing
  # on a POSIX runner exercises that, so the packaged CLI is installed and driven here.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Install the packaged CLI globally
        run: |
          npm pack --ignore-scripts
          npm install -g ./meocord-*.tgz
        shell: bash

      # Exercises the shim npm writes from the interpreter line, which is the part of
      # resolving a bin that no POSIX runner touches.
      - name: Drive the CLI through its Windows shim
        run: |
          meocord --version
          meocord --help
        shell: bash

      # Generation is what walks and writes paths, so it is run where the separator and
      # the case rules differ. `create` is not used here: it installs the version the
      # template pins, which is only published during a release.
      - name: Generate a controller on Windows
        run: |
          mkdir generated && cd generated
          echo '{"name":"generated","private":true}' > package.json
          meocord g co slash Sample
          test -f src/controllers/slash/sample.slash.controller.ts
          test -f src/controllers/slash/builders/sample.builder.ts
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Runs against dist rather than src, so it covers the package exports map and
      # the template copy as well as the templates themselves. Rendering a template
      # says nothing about whether the code it produces compiles.
      - name: Verify generated applications build
        run: bun run verify:generated

  # Publishes, and only that: it installs nothing beyond the repository's frozen lockfile and runs
  # no generated application, since any step here can request the token npm publishes with. The
  # generated applications are verified by the build job above.
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [lint, test-result, coverage, build, windows]
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
      # Publishing uses npm trusted publishing: npm exchanges this token with the
      # registry for short-lived credentials, so there is no npm token in the repo.
      # It is also what signs the provenance attestation.
      id-token: write
    env:
      # The action commits the version bump. Husky's pre-commit hook runs the full
      # lint, which has already passed on this commit and cannot fix a generated
      # CHANGELOG anyway, so it is skipped rather than run twice.
      HUSKY: 0
    steps:
      # The action pushes through the GitHub API rather than the git CLI, so it needs no
      # credentials left in the checkout — and the commits and tags it creates are signed
      # with GitHub's key instead of landing unverified.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The lockfile's exact packages, with no install scripts: the build needs none, and each one
      # would be code from a dependency running beside the publishing identity.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify provenance attestations
        run: npm audit signatures

      - name: Build package
        run: bun run build

      # A release from this branch is a 4.0 patch: a version of another line, a prerelease, or one below
      # what npm tags `latest` would move that tag backwards or onto the wrong line, so the job stops first.
      # The version already published, as on the first push after a release, passes: changesets skips it.
      - name: Refuse a version this branch does not release
        if: github.ref == 'refs/heads/release/4.0'
        run: |
          version=$(node -p "require('./package.json').version")
          latest=$(npm view meocord dist-tags.latest)
          # The ${…} in this script are JavaScript template literals, not shell expansions
          # shellcheck disable=SC2016
          node -e '
            const [version, latest] = process.argv.slice(1)
            const parts = v => v.split(".").map(Number)
            const below = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] < b[i]; return false }
            const problem = !/^\d+\.\d+\.\d+$/.test(latest)
              ? `npm returned "${latest}" for latest, which is not a release version; refusing to publish without it`
              : version.includes("-")
                ? `${version} is a prerelease; release/4.0 publishes 4.0 patches to latest`
                : !version.startsWith("4.0.")
                  ? `${version} is not a 4.0 version; release/4.0 publishes the 4.0 line only`
                  : below(parts(version), parts(latest))
                    ? `${version} is below ${latest}, which npm tags latest; publishing it would move latest backwards`
                    : ""
            if (problem) { console.error(`::error title=Not a 4.0 release::${problem}`); process.exit(1) }
            console.log(`${version} may be released from release/4.0 (npm latest is ${latest}).`)
          ' "$version" "$latest"

      # With pending changesets, this opens or updates the release pull request and
      # stops. With none — which is the state right after that pull request merges —
      # it publishes the version already committed. So the merge is the trigger, and
      # nothing reaches npm without one.
      # A pull request opened with the workflow's own token does not start CI on its own: GitHub
      # holds those runs until someone approves them. RELEASE_TOKEN, when the repository has one,
      # opens the release pull request as that identity instead, so its checks start like any
      # other. Without it, the workflow's token is used and the runs wait for approval.
      - name: Open the release pull request, or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: bun run release:version
          publish-script: bun run release:publish
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
