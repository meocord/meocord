name: Release

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    # `labeled` and `unlabeled` re-run the AGENTS.md guard when its approval label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - beta
  # GitHub's merge queue: the required checks run on the queued merge before it lands on main.
  merge_group:
    types: [checks_requested]
  # Publishing is gated by merging the release pull request, so this is not how a release is started. It re-runs the
  # checks, pack and publish after a publish fails partway.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in flight; any other run finishes. Each branch and each queued merge
# (gh-readonly-queue/...) has a group of its own, where a newer run replaces only one still waiting to start.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before `lint`, which runs prettier in --write mode: it would reformat the
      # working tree and exit 0, so nothing unformatted could ever fail CI.
      - name: Check formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      # AGENTS.md changes only with the maintainer's `agents-md-approved` label, and stays short.
      # A queued merge carries no labels; its pull request passed this check to be queued.
      - name: Guard AGENTS.md
        if: github.event_name == 'pull_request'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'agents-md-approved') }}
          MAX_LINES: 231
        # HEAD is the pull request merged into its base as the base is now, and its first parent is that base, so
        # their diff is the pull request's own change. The base SHA the event names can predate later merges.
        run: |
          git fetch --quiet --depth=2 origin "$GITHUB_SHA"
          if git diff --quiet HEAD^1 HEAD -- AGENTS.md; then exit 0; fi
          if [ "$APPROVED" != "true" ]; then
            echo "::error file=AGENTS.md::AGENTS.md changed without the maintainer's 'agents-md-approved' label."
            exit 1
          fi
          lines=$(wc -l < AGENTS.md)
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "::error file=AGENTS.md::AGENTS.md has $lines lines; keep it at $MAX_LINES or fewer."
            exit 1
          fi

      # Generated from the installed packages, so a dependency added without regenerating it
      # fails here rather than shipping a notice that leaves it out.
      - name: Check third-party notices
        run: bun run notices:check

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the newest LTS. Anything between the two
        # is covered by whichever of them breaks first.
        node: ['22.13', 'lts/*']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Check message matching stays within its budget
        run: bun run bench:messages

      - name: Check theming stays within its budget
        run: bun run bench:theme

  # Branch protection requires a check named exactly "Test". A matrix names each leg
  # after its parameters, so this gate carries that name and reports the matrix result,
  # and the slow CLI scenarios' on a pull request or a queued merge.
  test-result:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, slow-scenarios]
    if: always()
    steps:
      - name: Report the matrix result
        if: needs.test.result != 'success'
        run: |
          echo "One or more Node versions failed: ${{ needs.test.result }}"
          exit 1

      # Skipped only on a push or a manual re-run, where the release checks run them instead
      - name: Report the slow CLI scenarios
        if: >-
          needs.slow-scenarios.result != 'success' &&
          !(needs.slow-scenarios.result == 'skipped' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        run: |
          echo "The slow CLI scenarios failed: ${{ needs.slow-scenarios.result }}"
          exit 1

  # The slow CLI scenarios for a pull request and a queued merge, in parallel with the other jobs, so
  # a change that breaks one fails before it lands rather than on main. Like the release checks, the job
  # can only read the repository, since the scenarios install from outside the lockfile. They reach
  # Discord only with a token it refuses.
  slow-scenarios:
    name: Slow CLI scenarios
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run the slow CLI scenarios
        run: bun run cli:scenarios --tier slow

  # RedisCooldownStore's script, run on a real server through both clients the docs show. The spec
  # skips itself without REDIS_URL, so the other test jobs need no server.
  redis:
    name: Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the cooldown store on Redis
        run: bun run test src/common/redis-cooldown-store.redis.spec.ts
        env:
          REDIS_URL: redis://localhost:6379

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report coverage
        run: bun run test:coverage

  # Windows resolves a bin differently: npm never runs the file through its shebang,
  # it parses the line and writes a `.cmd` that runs the program named there. Nothing
  # on a POSIX runner exercises that, so the packaged CLI is installed and driven here.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Install the packaged CLI globally
        run: |
          npm pack --ignore-scripts
          npm install -g ./meocord-*.tgz
        shell: bash

      # Exercises the shim npm writes from the interpreter line, which is the part of
      # resolving a bin that no POSIX runner touches.
      - name: Drive the CLI through its Windows shim
        run: |
          meocord --version
          meocord --help
        shell: bash

      # Generation is what walks and writes paths, so it is run where the separator and
      # the case rules differ. `create` is not used here: it installs the version the
      # template pins, which is only published during a release.
      - name: Generate a controller on Windows
        run: |
          mkdir generated && cd generated
          echo '{"name":"generated","private":true}' > package.json
          meocord g co slash Sample
          test -f src/controllers/slash/sample.slash.controller.ts
          test -f src/controllers/slash/builders/sample.builder.ts
        shell: bash

      # Paths, separators and the create and config errors, where Windows resolves them differently.
      - name: Run the Windows CLI scenarios
        run: bun run cli:scenarios --windows

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # The tarball npm publishes, packed in place from this build as a release packs it: `package-dry-run` publishes
      # it with --dry-run from a job of its own, as `publish` publishes the one `pack` makes. Scripts are skipped so only
      # npm's JSON reaches the file; the one that would run, prepare, installs git hooks and packs nothing
      - name: Pack the package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/package/pack.json"

      - name: Keep the package for the dry run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 7

      # The declarations for import and for require export exactly what the source entry points declare
      - name: Check the built declarations
        run: bun run check:dist-types

      # The CommonJS build loads with Node's require() and logs, as a project that require()s meocord runs it
      - name: Check the CommonJS build
        run: bun run check:dist-cjs

      # Every JSDoc example that follows the standard in CONTRIBUTING.md, compiled against the build
      - name: Compile the JSDoc examples
        run: bun run check:jsdoc-examples

      # Installs an application from the packed build and runs its own lint, typecheck,
      # tests, coverage and builds. Rendering a template says nothing about whether the
      # code it produces passes any of them.
      - name: Verify generated applications
        run: bun run verify:generated

      # The real CLI from the packed build, through what must work and what must fail clearly: each
      # scenario asserts the exit code and what the output tells the user.
      - name: Run CLI scenarios
        run: bun run cli:scenarios

  # The packed package installed into one project per test runner its users test with: jest, vitest, node:test and bun
  # test. Each typechecks against the built declarations and runs a test of meocord/testing in that runner's own idiom.
  # The runners install as the consumers' lockfiles pin them, so a jest or vitest release cannot block a release; the
  # nightly workflow runs them resolved afresh, and Dependabot moves the locks.
  runners:
    name: Test runners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # The runners' packages, which the consumers install from the registry; meocord itself comes from the tarball
      - name: Cache the runners' packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: runners-${{ runner.os }}-${{ hashFiles('scripts/runner-consumers/*/bun.lock') }}

      - name: Test each runner against the packed package
        run: bun run verify:runners

  # Publishes, with --dry-run, the tarball `build` packed, from a job with no checkout: npm reads the package's
  # name, version and files from the tarball, as `publish` does with the one `pack` makes at a release. The files must
  # be the ones packing in place gave, so what a release publishes is what a pull request shows.
  package-dry-run:
    name: Package dry run
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package

      # --force skips only npm's release checks, among them the refusal of a version already published: main carries
      # the released version between releases, and those checks belong to the release, not to what the tarball holds.
      # The tag is never seen, as nothing is published.
      - name: Publish it with --dry-run
        working-directory: package
        run: |
          tarball=$(ls meocord-*.tgz)
          npm publish "./$tarball" --dry-run --force --json --provenance=false --tag dry-run > publish.json

      - name: Compare it with the package packed in place
        working-directory: package
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const packed = JSON.parse(readFileSync('pack.json', 'utf8'))[0]
          const published = Object.values(JSON.parse(readFileSync('publish.json', 'utf8')))[0]
          const files = entry => entry.files.map(file => file.path).sort()
          const problems = []
          for (const key of ['name', 'version']) {
            if (packed[key] !== published[key]) problems.push(`${key}: packed ${packed[key]}, published ${published[key]}`)
          }
          const [inPlace, fromTarball] = [files(packed), files(published)]
          for (const path of inPlace) if (!fromTarball.includes(path)) problems.push(`missing from the tarball's publish: ${path}`)
          for (const path of fromTarball) if (!inPlace.includes(path)) problems.push(`not packed in place: ${path}`)
          if (problems.length > 0) {
            for (const problem of problems) console.log(`::error title=Package dry run::${problem}`)
            process.exit(1)
          }
          console.log(`${published.name}@${published.version}: the tarball publishes the ${inPlace.length} files packing in place gave.`)
          EOF

  # The checks that run code from outside the lockfile (a generated app's dependency tree, its bot, bundling, sharding),
  # for a push to main or beta or a manual re-run, in a read-only job, so that code never runs where the publishing
  # identity can be requested. Needs are named one by one: the implicit success() also reads the slow scenarios job,
  # which "Test" reports and a push skips.
  release-checks:
    name: Release checks
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' && needs.test-result.result == 'success' &&
      needs.coverage.result == 'success' && needs.build.result == 'success' && needs.windows.result == 'success' &&
      needs.runners.result == 'success'
    needs: [lint, test-result, coverage, build, windows, runners]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Installs an application from the packed build and runs its own lint, typecheck,
      # tests, coverage and builds. Rendering a template says nothing about whether the
      # code it produces passes any of them.
      - name: Verify generated applications
        run: bun run verify:generated

      # The CLI scenarios that install with npm, run on bun, bundle, shard and send signals, on the
      # commit that is released; pull requests and queued merges run them in their own job.
      - name: Run the slow CLI scenarios
        run: bun run cli:scenarios --tier slow

  # The smoke app against real Discord (see "Checking against real Discord" in CONTRIBUTING.md), its `e2e` secrets
  # reaching only the step that runs it. Not a required check, so an outage at Discord blocks nothing, and test:e2e
  # passes without secrets. Skipped in the merge queue: the pull request ran it, and the push to main runs it again.
  e2e:
    name: Real Discord
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e
    permissions:
      contents: read
    # One run at a time across workflows, since every run logs in as the same bot. This group cancels none, and pending
    # runs queue in the order they arrive, rather than each new one replacing the one already waiting.
    concurrency:
      group: discord-e2e
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CLI and the bot run on node, the one the engines field names.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Check against real Discord
        env:
          MEOCORD_E2E_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_BOT_TOKEN }}
          MEOCORD_E2E_GUILD_ID: ${{ secrets.MEOCORD_E2E_GUILD_ID }}
          MEOCORD_E2E_CHANNEL_ID: ${{ secrets.MEOCORD_E2E_CHANNEL_ID }}
          MEOCORD_E2E_HELPER_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_HELPER_BOT_TOKEN }}
        run: |
          for token in "$MEOCORD_E2E_BOT_TOKEN" "$MEOCORD_E2E_HELPER_BOT_TOKEN"; do
            if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          done
          bun run test:e2e

  # A pull request from a fork gets no secrets, so the real-Discord checks do not run for it. This says
  # so on the run instead of leaving a silently skipped job.
  e2e-fork:
    name: Real Discord (not run for forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the skip
        run: echo "::notice title=Real Discord not run::Pull requests from forks get no Discord secrets, so the real-Discord checks run only for branches of this repository, nightly and on main."

  # Versions, and only that: with pending changesets it opens or updates the release pull request; with none it does
  # nothing. It runs `changeset version` and prettier, code from dependencies, so it holds no publishing identity.
  # Needs are named one by one, so the slow scenarios job a push skips does not skip it, and a failed need stops it.
  release:
    name: Release
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' && needs.test-result.result == 'success' &&
      needs.coverage.result == 'success' && needs.build.result == 'success' && needs.windows.result == 'success' &&
      needs.runners.result == 'success' && needs.release-checks.result == 'success'
    needs: [lint, test-result, coverage, build, windows, runners, release-checks]
    runs-on: ubuntu-latest
    # For RELEASE_TOKEN, a secret of this environment. Without `id-token` the job cannot request npm's credentials.
    environment: Production
    outputs:
      pending: ${{ steps.changesets.outputs.has-changesets }}
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The action pushes through the GitHub API rather than the git CLI, so it needs no
      # credentials left in the checkout — and the commits it creates are signed with
      # GitHub's key instead of landing unverified.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # With pending changesets this opens or updates the release pull request; with none, as right after it merges, it
      # does nothing, and `pack` and `publish` release the committed version, so nothing reaches npm without that merge.
      # RELEASE_TOKEN, when set, opens the pull request so its checks start; GitHub holds the checks of one opened with
      # the workflow's own token until someone approves them.
      - name: Open or update the release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: bun run release:version
          pr-title: 'chore: release'
          commit-message: 'chore: release'

  # Builds and packs the version committed, once nothing is pending, for `publish` to publish. The build runs code from
  # dependencies, so it happens here, with no publishing identity and no environment: the tarball and the publish plan
  # changesets writes beside it, the version's dist-tag among them, are uploaded as an artifact.
  pack:
    name: Pack
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.pending == 'false' }}
    needs: release
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # `changeset pack`: packs each version npm does not have yet, with the dist-tag pre mode gives it
      - name: Pack
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Publishes the tarball `pack` made, with its publish plan's dist-tag, then pushes the version's tag and creates its
  # GitHub release. It holds the publishing identity, so only changesets and npm run here: the install runs no scripts,
  # nothing is built, and npm runs no lifecycle script for a tarball. Needs are named, so a failed or skipped pack
  # stops it.
  publish:
    name: Publish
    if: >-
      !cancelled() &&
      needs.release.result == 'success' && needs.release.outputs.pending == 'false' &&
      needs.pack.result == 'success'
    needs: [release, pack]
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      published: ${{ steps.publish.outputs.published }}
      # The one package this repository publishes, as changesets reports it
      version: ${{ fromJSON(steps.publish.outputs.published-packages || '[]')[0].version }}
    concurrency:
      group: publish-${{ github.ref }}
    permissions:
      # Pushes the version's tag and creates its GitHub release
      contents: write
      # Publishing uses npm trusted publishing: npm exchanges this token with the
      # registry for short-lived credentials, so there is no npm token in the repo.
      # It is also what signs the provenance attestation.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Changesets' CLI, which the action runs: the lockfile's exact packages, with no install scripts
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify provenance attestations
        run: npm audit signatures

      # `changeset publish --from-pack-dir`: publishes the tarball as it was packed, then the action pushes its tag
      # and creates its release
      - name: Publish
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          npm_config_ignore_scripts: 'true'
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.artifact-id }}
          create-github-releases: true

  # Starts meocord/docs's version sync (.github/workflows/sync-versions.yml) rather than wait for its hourly run, as the
  # docs bot, a GitHub App whose token here may only start workflows there; DOCS_BOT_CLIENT_ID and DOCS_BOT_PRIVATE_KEY
  # live in Production. A job of its own, away from the publishing identity: the release is published before it runs,
  # and only a version npm never serves fails it.
  docs-sync:
    name: Docs sync
    needs: publish
    # Named directly, with !cancelled(): the implicit success() also reads the skipped slow scenarios job on a push
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    permissions: {}
    steps:
      - name: Skip without the docs bot
        if: vars.DOCS_BOT_CLIENT_ID == ''
        run: echo "::notice title=Docs sync not configured::The docs site's hourly schedule will pick up this release."

      # npm serves a new version a minute or two after it is published, and a sync started earlier finds nothing to add
      - name: Wait for npm to serve the version
        if: vars.DOCS_BOT_CLIENT_ID != ''
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          WAIT_SECONDS: 600
          POLL_SECONDS: 15
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error title=Docs sync not started::The publish job reported no version of meocord."
            exit 1
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          until [ "$(npm view "meocord@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Docs sync not started::npm still doesn't serve meocord@$VERSION after $WAIT_SECONDS s; start meocord/docs's Sync versions by hand once it does."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          echo "npm serves meocord@$VERSION, after ${SECONDS} s."

      - name: Mint the docs bot's token
        id: token
        if: vars.DOCS_BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: meocord
          repositories: docs
          permission-actions: write

      - name: Start the docs sync
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if ! gh workflow run sync-versions.yml --repo meocord/docs; then
            echo "::warning title=Docs sync not started::Starting meocord/docs's version sync failed; its hourly schedule will pick up this release."
          fi

      - name: Report a token the docs bot could not mint
        if: steps.token.outcome == 'failure'
        run: echo "::warning title=Docs sync not started::The docs bot's token could not be minted; the docs site's hourly schedule will pick up this release."
