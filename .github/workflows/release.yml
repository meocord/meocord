name: Release

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    # `labeled` and `unlabeled` re-run the AGENTS.md guard when its approval label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - beta
  # GitHub's merge queue: the required checks run on the queued merge before it lands on main.
  merge_group:
    types: [checks_requested]
  # Publishing is gated by merging the release pull request, so this is not how a
  # release is started. It is here to re-run the job after a publish fails partway.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run in flight irrelevant. Release branches are
# keyed individually so a release is never cancelled by the push that follows it, and each
# queued merge has a ref of its own (gh-readonly-queue/...), so none cancels another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before `lint`, which runs prettier in --write mode: it would reformat the
      # working tree and exit 0, so nothing unformatted could ever fail CI.
      - name: Check formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      # AGENTS.md changes only with the maintainer's `agents-md-approved` label, and stays short.
      # A queued merge carries no labels; its pull request passed this check to be queued.
      - name: Guard AGENTS.md
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'agents-md-approved') }}
          MAX_LINES: 230
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- AGENTS.md; then exit 0; fi
          if [ "$APPROVED" != "true" ]; then
            echo "::error file=AGENTS.md::AGENTS.md changed without the maintainer's 'agents-md-approved' label."
            exit 1
          fi
          lines=$(wc -l < AGENTS.md)
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "::error file=AGENTS.md::AGENTS.md has $lines lines; keep it at $MAX_LINES or fewer."
            exit 1
          fi

      # Generated from the installed packages, so a dependency added without regenerating it
      # fails here rather than shipping a notice that leaves it out.
      - name: Check third-party notices
        run: bun run notices:check

  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` declares, and the newest LTS. Anything between the two
        # is covered by whichever of them breaks first.
        node: ['22.13', 'lts/*']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Check message matching stays within its budget
        run: bun run bench:messages

      - name: Check theming stays within its budget
        run: bun run bench:theme

  # Branch protection requires a check named exactly "Test". A matrix names each leg
  # after its parameters, so this gate carries that name and reports the matrix result,
  # and the slow CLI scenarios' on a pull request or a queued merge.
  test-result:
    name: Test
    runs-on: ubuntu-latest
    needs: [test, slow-scenarios]
    if: always()
    steps:
      - name: Report the matrix result
        if: needs.test.result != 'success'
        run: |
          echo "One or more Node versions failed: ${{ needs.test.result }}"
          exit 1

      # Skipped on a push, where the release checks run them instead
      - name: Report the slow CLI scenarios
        if: needs.slow-scenarios.result != 'success' && needs.slow-scenarios.result != 'skipped'
        run: |
          echo "The slow CLI scenarios failed: ${{ needs.slow-scenarios.result }}"
          exit 1

  # The slow CLI scenarios for a pull request and a queued merge, in parallel with the other jobs, so
  # a change that breaks one fails before it lands rather than on main. Like the release checks, the job
  # can only read the repository, since the scenarios install from outside the lockfile. They reach
  # Discord only with a token it refuses.
  slow-scenarios:
    name: Slow CLI scenarios
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run the slow CLI scenarios
        run: bun run cli:scenarios --tier slow

  # RedisCooldownStore's script, run on a real server through both clients the README shows. The spec
  # skips itself without REDIS_URL, so the other test jobs need no server.
  redis:
    name: Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the cooldown store on Redis
        run: bun run test src/common/redis-cooldown-store.redis.spec.ts
        env:
          REDIS_URL: redis://localhost:6379

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report coverage
        run: bun run test:coverage

  # Windows resolves a bin differently: npm never runs the file through its shebang,
  # it parses the line and writes a `.cmd` that runs the program named there. Nothing
  # on a POSIX runner exercises that, so the packaged CLI is installed and driven here.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Install the packaged CLI globally
        run: |
          npm pack --ignore-scripts
          npm install -g ./meocord-*.tgz
        shell: bash

      # Exercises the shim npm writes from the interpreter line, which is the part of
      # resolving a bin that no POSIX runner touches.
      - name: Drive the CLI through its Windows shim
        run: |
          meocord --version
          meocord --help
        shell: bash

      # Generation is what walks and writes paths, so it is run where the separator and
      # the case rules differ. `create` is not used here: it installs the version the
      # template pins, which is only published during a release.
      - name: Generate a controller on Windows
        run: |
          mkdir generated && cd generated
          echo '{"name":"generated","private":true}' > package.json
          meocord g co slash Sample
          test -f src/controllers/slash/sample.slash.controller.ts
          test -f src/controllers/slash/builders/sample.builder.ts
        shell: bash

      # Paths, separators and the create and config errors, where Windows resolves them differently.
      - name: Run the Windows CLI scenarios
        run: bun run cli:scenarios --windows

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Every JSDoc example that follows the standard in CONTRIBUTING.md, compiled against the build
      - name: Compile the JSDoc examples
        run: bun run check:jsdoc-examples

      # Installs an application from the packed build and runs its own lint, typecheck,
      # tests, coverage and builds. Rendering a template says nothing about whether the
      # code it produces passes any of them.
      - name: Verify generated applications
        run: bun run verify:generated

      # The real CLI from the packed build, through what must work and what must fail clearly: each
      # scenario asserts the exit code and what the output tells the user.
      - name: Run CLI scenarios
        run: bun run cli:scenarios

  # The checks that install and run code from outside the repository's lockfile: a generated
  # application's whole dependency tree, its bot, bundling, sharding. They gate a release, so they
  # run before it, but in a job of their own that can only read the repository: code they install
  # never runs where the publishing identity can be requested.
  # Only for a push to main or beta, or a manual re-run: never for a pull request or a queued merge.
  release-checks:
    name: Release checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, test-result, coverage, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # Installs an application from the packed build and runs its own lint, typecheck,
      # tests, coverage and builds. Rendering a template says nothing about whether the
      # code it produces passes any of them.
      - name: Verify generated applications
        run: bun run verify:generated

      # The CLI scenarios that install with npm, run on bun, bundle, shard and send signals, on the
      # commit that is released; pull requests and queued merges run them in their own job.
      - name: Run the slow CLI scenarios
        run: bun run cli:scenarios --tier slow

  # The smoke app against real Discord, as the test application's bot: see "Checking against real
  # Discord" in CONTRIBUTING.md. Its secrets live in the `e2e` environment and reach only the step that
  # runs it. Not a required check, so an outage at Discord blocks nothing; test:e2e skips and passes
  # when the environment has no secrets. Skipped in the merge queue: the pull request already ran it,
  # and the push to main runs it again.
  e2e:
    name: Real Discord
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e
    permissions:
      contents: read
    # One run at a time across workflows, since every run logs in as the same bot; none is cancelled
    concurrency:
      group: discord-e2e
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CLI and the bot run on node, the one the engines field names.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Check against real Discord
        env:
          MEOCORD_E2E_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_BOT_TOKEN }}
          MEOCORD_E2E_GUILD_ID: ${{ secrets.MEOCORD_E2E_GUILD_ID }}
          MEOCORD_E2E_CHANNEL_ID: ${{ secrets.MEOCORD_E2E_CHANNEL_ID }}
          MEOCORD_E2E_HELPER_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_HELPER_BOT_TOKEN }}
        run: |
          for token in "$MEOCORD_E2E_BOT_TOKEN" "$MEOCORD_E2E_HELPER_BOT_TOKEN"; do
            if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          done
          bun run test:e2e

  # A pull request from a fork gets no secrets, so the real-Discord checks do not run for it. This says
  # so on the run instead of leaving a silently skipped job.
  e2e-fork:
    name: Real Discord (not run for forks)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the skip
        run: echo "::notice title=Real Discord not run::Pull requests from forks get no Discord secrets, so the real-Discord checks run only for branches of this repository, nightly and on main."

  # Publishes, and only that: it installs nothing beyond the repository's frozen lockfile and runs
  # no generated application, since any step here can request the token npm publishes with.
  release:
    name: Release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, test-result, coverage, build, windows, release-checks]
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
      pull-requests: write
      # Publishing uses npm trusted publishing: npm exchanges this token with the
      # registry for short-lived credentials, so there is no npm token in the repo.
      # It is also what signs the provenance attestation.
      id-token: write
    env:
      # The action commits the version bump. Husky's pre-commit hook runs the full
      # lint, which has already passed on this commit and cannot fix a generated
      # CHANGELOG anyway, so it is skipped rather than run twice.
      HUSKY: 0
    steps:
      # The action pushes through the GitHub API rather than the git CLI, so it needs no
      # credentials left in the checkout — and the commits and tags it creates are signed
      # with GitHub's key instead of landing unverified.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The lockfile's exact packages, with no install scripts: the build needs none, and each one
      # would be code from a dependency running beside the publishing identity.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify provenance attestations
        run: npm audit signatures

      - name: Build package
        run: bun run build

      # With pending changesets, this opens or updates the release pull request and
      # stops. With none — which is the state right after that pull request merges —
      # it publishes the version already committed. So the merge is the trigger, and
      # nothing reaches npm without one.
      # A pull request opened with the workflow's own token does not start CI on its own: GitHub
      # holds those runs until someone approves them. RELEASE_TOKEN, when the repository has one,
      # opens the release pull request as that identity instead, so its checks start like any
      # other. Without it, the workflow's token is used and the runs wait for approval.
      - name: Open the release pull request, or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version-script: bun run release:version
          publish-script: bun run release:publish
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          create-github-releases: true
