name: Nightly

# Every CLI scenario, fast and slow, and the generated applications' own checks, against the newest
# releases of what an application installs, and the smoke app against real Discord. A dependency or
# Discord change that breaks one shows up here before a release does. A failure fails the run and
# nothing else: this workflow reads the repository and has no other permission.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  scenarios:
    name: CLI scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated application's tools run through their node shebangs, and the CLI
      # needs the Node its engines field names, not whichever one the image carries.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Verify generated applications
        run: bun run verify:generated

      - name: Run every CLI scenario
        run: bun run cli:scenarios --tier all

  # The smoke app against real Discord, as the test application's bot: see "Checking against real
  # Discord" in CONTRIBUTING.md. Its secrets live in the `e2e` environment and reach only the step that
  # runs it. Not a required check, so an outage at Discord blocks nothing; test:e2e skips and passes
  # when the environment has no secrets.
  e2e:
    name: Real Discord
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: e2e
    permissions:
      contents: read
    # One run at a time across workflows, since every run logs in as the same bot. This group cancels none, and pending
    # runs queue in the order they arrive, rather than each new one replacing the one already waiting.
    concurrency:
      group: discord-e2e
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CLI and the bot run on node, the one the engines field names.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Check against real Discord
        env:
          MEOCORD_E2E_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_BOT_TOKEN }}
          MEOCORD_E2E_GUILD_ID: ${{ secrets.MEOCORD_E2E_GUILD_ID }}
          MEOCORD_E2E_CHANNEL_ID: ${{ secrets.MEOCORD_E2E_CHANNEL_ID }}
          MEOCORD_E2E_HELPER_BOT_TOKEN: ${{ secrets.MEOCORD_E2E_HELPER_BOT_TOKEN }}
        run: |
          for token in "$MEOCORD_E2E_BOT_TOKEN" "$MEOCORD_E2E_HELPER_BOT_TOKEN"; do
            if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          done
          bun run test:e2e
